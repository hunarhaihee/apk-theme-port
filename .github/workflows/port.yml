name: port

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  OLD_ID: 13wcxu4zGVUC0VS6eiNYNq88Q7VArFLa6
  NEW_ID: 1FdVb8AEZrSUY7eRERrArtpiJBNau9UFd

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate Android build-tools
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$SDK" ANDROID_HOME="$SDK"
          BT=""
          if [ -d "$SDK/build-tools" ]; then
            BT="$(ls "$SDK/build-tools" | sort -V | tail -1)"
          fi
          if [ -z "$BT" ] || [ ! -x "$SDK/build-tools/$BT/zipalign" ]; then
            SDKM="$(command -v sdkmanager || true)"
            [ -n "$SDKM" ] || SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
            ( yes | "$SDKM" --licenses > /dev/null 2>&1 ) || true
            ( yes | "$SDKM" "build-tools;34.0.0" > /dev/null 2>&1 ) || true
            BT="34.0.0"
          fi
          echo "build-tools version: $BT"
          echo "$SDK/build-tools/$BT" >> "$GITHUB_PATH"
          python3 -m pip install --quiet Pillow || python3 -m pip install --quiet --break-system-packages Pillow
          python3 -c "import PIL; print('Pillow', PIL.__version__)"

      - name: Install apktool (iBotPeaches)
        run: |
          set -uo pipefail
          mkdir -p tools
          get() {
            url="$1"
            for i in 1 2 3 4; do
              if curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 \
                   -H 'Accept: application/octet-stream' -o tools/apktool.jar "$url"; then
                if unzip -p tools/apktool.jar META-INF/MANIFEST.MF > /dev/null 2>&1; then
                  echo "downloaded $url (attempt $i)"
                  return 0
                fi
                echo "jar looks corrupt from $url"
              else
                echo "download failed: $url (attempt $i)"
              fi
              sleep 4
            done
            return 1
          }
          ok=0
          for url in \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar \
            https://api.github.com/repos/iBotPeaches/Apktool/releases/assets/483349654 \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.2/apktool_3.0.2.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar ; do
            if get "$url"; then ok=1; break; fi
          done
          if [ "$ok" -ne 1 ]; then echo 'could not download any apktool jar'; exit 1; fi
          java -jar tools/apktool.jar --version

      - name: Run pipeline
        run: bash scripts/pipeline.sh

      - name: Publish report to repo
        if: always()
        run: |
          mkdir -p ci
          for f in report/*.txt report/*.log; do
            if [ -f "$f" ]; then cp "$f" "ci/$(basename "$f")"; fi
          done
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -A ci || true
          git commit -m "ci: update report [skip ci]" || true
          git push origin HEAD:main || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: themed-apk
          if-no-files-found: ignore
          path: |
            apks/new_themed_signed.apk
            report/*

      - name: Attach APK to release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete themed-apk --yes --cleanup-tag 2>/dev/null || true
          gh release create themed-apk apks/new_themed_signed.apk \
            --title "Themed APK (old icon + theme, new features)" \
            --notes "Signed with a freshly generated key. Uninstall the stock app first (signature differs)."
